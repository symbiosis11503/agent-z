[project]
name = "agentz-ch11-frameworks"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.45",
]

[project.optional-dependencies]
# 每家獨立裝（避免一次裝爆 1GB+）
# uv pip install -e ".[langgraph]"
langgraph = ["langgraph>=0.2", "langchain-anthropic>=0.3"]
crewai = ["crewai>=0.80", "crewai-tools>=0.20"]
smolagents = ["smolagents>=1.2", "litellm>=1.50"]
pydantic_ai = ["pydantic-ai>=0.0.20"]
